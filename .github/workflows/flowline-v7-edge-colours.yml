name: Apply Flowline v7 edge colours

on:
  push:
    paths:
      - '.github/workflows/flowline-v7-edge-colours.yml'
  issues:
    types: [opened, edited]

permissions:
  contents: write

jobs:
  patch-flowline:
    if: github.event_name == 'push' || github.event.issue.title == 'Flowline v7 edge colour deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply per-node edge colour patch
        shell: bash
        run: |
          cat > /tmp/flowline-v7.patch <<'FLOWLINE_PATCH'
--- a/index.html
+++ b/index.html
@@ -1439,6 +1439,42 @@
               Solid
             </button>
           </div>
+        </div>
+      </div>
+
+      <div class="field node-colour-shell">
+        <div class="node-colour-header">
+          <span class="node-colour-label">Outgoing edge colour</span>
+          <span class="node-colour-value" id="edgeColourValue">Inherited cascade</span>
+        </div>
+
+        <div class="colour-swatches" id="edgeColourPresets"></div>
+
+        <div class="custom-colour-row">
+          <input
+            class="custom-colour-picker"
+            id="customEdgeColour"
+            type="color"
+            value="#00e5ff"
+            title="Choose a custom outgoing edge colour"
+            aria-label="Choose a custom outgoing edge colour"
+          />
+          <button class="custom-colour-button" id="useCustomEdgeColour" type="button">
+            Use + remember custom colour
+          </button>
+        </div>
+
+        <div class="saved-colour-group">
+          <div class="saved-colour-title">Saved custom colours</div>
+          <div class="colour-swatches" id="savedEdgeColours"></div>
+          <div class="saved-colours-empty" id="savedEdgeColoursEmpty">
+            Your saved custom colours will appear here for reuse.
+          </div>
+        </div>
+
+        <div class="hint" style="text-align:left;margin-top:0;">
+          Default keeps the dependency colour inherited from the first-stage root.
+          An override affects only edges leaving this node.
         </div>
       </div>
 
@@ -1556,6 +1592,12 @@
       const nodeColourValue = document.getElementById("nodeColourValue");
       const nodeColourStyleGradient = document.getElementById("nodeColourStyleGradient");
       const nodeColourStyleSolid = document.getElementById("nodeColourStyleSolid");
+      const edgeColourPresets = document.getElementById("edgeColourPresets");
+      const customEdgeColour = document.getElementById("customEdgeColour");
+      const useCustomEdgeColourButton = document.getElementById("useCustomEdgeColour");
+      const savedEdgeColours = document.getElementById("savedEdgeColours");
+      const savedEdgeColoursEmpty = document.getElementById("savedEdgeColoursEmpty");
+      const edgeColourValue = document.getElementById("edgeColourValue");
       const deleteTaskButton = document.getElementById("deleteTask");
       const taskDialogTitle = document.getElementById("dialogTitle");
       const taskDialogSubtitle = document.getElementById("taskDialogSubtitle");
@@ -1574,6 +1616,7 @@
       let editingChecklist = [];
       let editingNodeColour = null;
       let editingNodeColourStyle = "gradient";
+      let editingEdgeColour = null;
       let savedCustomNodeColours = loadSavedCustomNodeColours();
 
       let draggingTaskId = null;
@@ -1795,6 +1838,9 @@
             nodeColorStyle: String(task.nodeColorStyle || "gradient") === "solid"
               ? "solid"
               : "gradient",
+            edgeColor: /^#[0-9a-f]{6}$/i.test(String(task.edgeColor || ""))
+              ? String(task.edgeColor).toLowerCase()
+              : null,
             done: checklist.length
               ? checklist.every(item => item.done)
               : Boolean(task.done)
@@ -2211,6 +2257,7 @@
 
         saveCustomNodeColours();
         renderNodeColourPicker();
+        renderEdgeColourPicker();
       }
 
       function makeColourSwatch(colour, name, isDefault = false) {
@@ -2239,6 +2286,60 @@
         });
 
         return button;
+      }
+
+      function makeEdgeColourSwatch(colour, name, isDefault = false) {
+        const button = document.createElement("button");
+        button.className = `colour-swatch${isDefault ? " default-colour" : ""}`;
+        button.type = "button";
+        button.title = name;
+        button.setAttribute("aria-label", `Use ${name}`);
+
+        if (colour) {
+          button.style.setProperty("--swatch", colour);
+        }
+
+        const selected = isDefault
+          ? !editingEdgeColour
+          : editingEdgeColour === colour;
+
+        if (selected) {
+          button.classList.add("selected");
+        }
+
+        button.addEventListener("click", () => {
+          editingEdgeColour = colour || null;
+          renderEdgeColourPicker();
+        });
+
+        return button;
+      }
+
+      function renderEdgeColourPicker() {
+        edgeColourPresets.replaceChildren();
+
+        edgeColourPresets.appendChild(
+          makeEdgeColourSwatch(null, "Inherited dependency colour", true)
+        );
+
+        PRESET_NODE_COLOURS.forEach(preset => {
+          edgeColourPresets.appendChild(
+            makeEdgeColourSwatch(preset.value, preset.name)
+          );
+        });
+
+        savedEdgeColours.replaceChildren();
+        savedEdgeColoursEmpty.hidden = savedCustomNodeColours.length > 0;
+
+        savedCustomNodeColours.forEach(colour => {
+          savedEdgeColours.appendChild(
+            makeEdgeColourSwatch(colour, `Saved custom colour ${colour}`)
+          );
+        });
+
+        edgeColourValue.textContent = editingEdgeColour
+          ? editingEdgeColour.toUpperCase()
+          : "Inherited cascade";
       }
 
       function renderNodeColourStylePicker() {
@@ -2438,7 +2539,7 @@
         card.className = `task-card${task.done ? " done" : ""}`;
         card.dataset.taskId = task.id;
 
-        const dependencyColor = getDependencyColor(task);
+        const dependencyColor = getOutgoingEdgeColor(task);
         card.style.setProperty("--dependency-color", dependencyColor);
 
         if (task.nodeColor) {
@@ -2680,6 +2781,14 @@
         const index = rootIndex >= 0 ? rootIndex : fallbackIndex;
 
         return DEPENDENCY_COLORS[index % DEPENDENCY_COLORS.length];
+      }
+
+      function getOutgoingEdgeColor(task) {
+        if (task && /^#[0-9a-f]{6}$/i.test(String(task.edgeColor || ""))) {
+          return String(task.edgeColor).toLowerCase();
+        }
+
+        return getDependencyColor(task);
       }
 
       function syncTaskDoneFromChecklist(task) {
@@ -2910,9 +3019,11 @@
         editingNodeColourStyle = existing?.nodeColorStyle === "solid"
           ? "solid"
           : "gradient";
+        editingEdgeColour = existing?.edgeColor || null;
         taskDoneInput.checked = Boolean(existing?.done);
         renderChecklistEditor();
         renderNodeColourPicker();
+        renderEdgeColourPicker();
         renderStagePicker(defaultStageId);
 
         taskDialog.showModal();
@@ -2925,6 +3036,7 @@
         editingChecklist = [];
         editingNodeColour = null;
         editingNodeColourStyle = "gradient";
+        editingEdgeColour = null;
         checklistEditor.replaceChildren();
         taskForm.reset();
         taskDialog.close();
@@ -3194,7 +3306,7 @@
               toRect,
               fromStageIndex: stageIndex(fromTask.stage),
               toStageIndex: stageIndex(toTask.stage),
-              color: getDependencyColor(toTask),
+              color: getOutgoingEdgeColor(fromTask),
               familyId: getDependencyRootTask(toTask)?.id || fromTask.id,
               logicalParentId: toTask.parentId,
               sourceSlot: 0,
@@ -3924,6 +4036,23 @@
         renderNodeColourPicker();
       });
 
+      useCustomEdgeColourButton.addEventListener("click", () => {
+        const colour = String(customEdgeColour.value || "").toLowerCase();
+
+        if (!/^#[0-9a-f]{6}$/i.test(colour)) {
+          return;
+        }
+
+        editingEdgeColour = colour;
+        rememberCustomNodeColour(colour);
+        renderEdgeColourPicker();
+      });
+
+      customEdgeColour.addEventListener("input", () => {
+        editingEdgeColour = String(customEdgeColour.value || "").toLowerCase();
+        renderEdgeColourPicker();
+      });
+
       nodeColourStyleGradient.addEventListener("click", () => {
         editingNodeColourStyle = "gradient";
         renderNodeColourStylePicker();
@@ -4007,6 +4136,7 @@
             task.checklist = checklist;
             task.nodeColor = editingNodeColour;
             task.nodeColorStyle = editingNodeColourStyle;
+            task.edgeColor = editingEdgeColour;
             task.done = automaticDone;
           }
         } else {
@@ -4019,6 +4149,7 @@
             checklist,
             nodeColor: editingNodeColour,
             nodeColorStyle: editingNodeColourStyle,
+            edgeColor: editingEdgeColour,
             done: automaticDone
           });
         }
FLOWLINE_PATCH
          git apply --check /tmp/flowline-v7.patch
          git apply /tmp/flowline-v7.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '      let editingNodeColourStyle = "gradient";\n      let editingEdgeColour = null;',
              '      let editingNodeColourStyle = "solid";\n      let editingEdgeColour = null;',
              1,
          )
          text = text.replace(
              '        editingNodeColourStyle = existing?.nodeColorStyle === "solid"\n          ? "solid"\n          : "gradient";\n        editingEdgeColour = existing?.edgeColor || null;',
              '        editingNodeColourStyle = existing\n          ? (existing.nodeColorStyle === "solid" ? "solid" : "gradient")\n          : "solid";\n        editingEdgeColour = existing?.edgeColor || null;',
              1,
          )
          text = text.replace(
              '        editingNodeColourStyle = "gradient";\n        editingEdgeColour = null;',
              '        editingNodeColourStyle = "solid";\n        editingEdgeColour = null;',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'Outgoing edge colour' index.html
          grep -q 'color: getOutgoingEdgeColor(fromTask)' index.html
          grep -q 'let editingNodeColourStyle = "solid"' index.html

      - name: Commit Flowline v7
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add per-node edge colours and solid node default"
          git push origin HEAD:main
