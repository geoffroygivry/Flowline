<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowline</title>
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #f5f5f2;
      color: #8b908b;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Flowline…</div>
  <script>
    (async () => {
      const response = await fetch("./flowline-v7.payload", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load Flowline payload (${response.status})`);
      }

      const payload = (await response.text()).replace(/\s+/g, "");
      const bytes = Uint8Array.from(atob(payload), character => character.charCodeAt(0));
      const stream = new Blob([bytes])
        .stream()
        .pipeThrough(new DecompressionStream("gzip"));
      const source = await new Response(stream).text();

      document.open();
      document.write(source);
      document.close();
    })().catch(error => {
      console.error(error);
      const loading = document.getElementById("loading");
      if (loading) {
        loading.textContent = "Flowline could not start in this browser.";
      }
    });
  </script>
</body>
</html>
